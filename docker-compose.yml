# Chạy cả hệ thống bằng Docker, không cần cài Node.js hay PostgreSQL trên máy (README mục 3, cách B):
#   docker compose up --build      → http://localhost:3000
#   docker compose down            (thêm -v để xóa luôn dữ liệu CSDL)
# Không cần file .env: các biến dưới đây thay cho .env. Đổi cổng máy bằng APP_PORT=3001 docker compose up.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_crm_l2
    volumes:
      - db-data:/var/lib/postgresql/data
    # Chỉ dịch vụ app kết nối qua mạng nội bộ của compose; không mở cổng 5432 ra máy
    # để không đụng PostgreSQL đã cài sẵn trên máy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_crm_l2"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_crm_l2
      # Khóa dùng cho bản demo; triển khai thật thì truyền JWT_SECRET từ môi trường.
      JWT_SECRET: ${JWT_SECRET:-demo-docker-doi-chuoi-nay-khi-trien-khai-that}
      JWT_EXPIRES_IN: 8h
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
